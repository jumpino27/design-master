[package]
name = "design-gen-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "design-gen-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "cors", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.43"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.12"
http-body-util = "0.1"
