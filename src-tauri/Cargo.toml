[package]
name = "design-master-desktop"
version = "1.1.2"
description = "Design Master (DM) — Native Tauri Desktop AI Design Workbench"
authors = ["Design Master Contributors"]
license = "MIT"
edition = "2021"

[[bin]]
name = "design-master"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
design-gen-server = { path = "../crates/server" }
tauri = { version = "2", features = [] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"
tauri-plugin-single-instance = "2"
